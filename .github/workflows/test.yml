name: test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-slim
    permissions:
      contents: read  # checkout only
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Sync dev environment
        run: uv sync --all-extras --group dev

      - name: Run pytest
        run: uv run pytest -v

  e2e:
    name: e2e (Airflow ${{ matrix.airflow-version }})
    runs-on: ubuntu-latest  # needs Docker + compose v2 (not on ubuntu-slim)
    permissions:
      contents: read  # checkout only
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "3.1.0"
            python-version: "3.12"
          - airflow-version: "3.3.1"
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run e2e suite in Docker
        working-directory: tests/e2e
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: docker compose run --rm --build e2e

  node-test:
    name: node --test (bundle_inspector JS)
    runs-on: ubuntu-slim
    permissions:
      contents: read  # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run node --test
        run: node --test

  all-pass:
    name: All tests passed
    runs-on: ubuntu-slim
    needs: [pytest, e2e, node-test]
    if: always()
    steps:
      - uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJson(needs) }}
