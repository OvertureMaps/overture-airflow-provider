# Releases and publishes airflow-provider-overture in two scenarios:
#   1. Push to main (production): python-semantic-release computes the next version from the
#      Conventional Commits since the last tag. If a release is warranted it pushes a `v<version>`
#      tag and creates a GitHub Release (no version bump or changelog is committed back to main),
#      then builds and publishes to PyPI.
#   2. workflow_dispatch (dry-run): no tagging, no release; builds the current state and
#      publishes to Test PyPI to verify the pipeline end-to-end.
# Uses OIDC trusted publishing — no PyPI API token required.
#
# `project.version` in pyproject.toml is not the source of truth: the release version is stamped
# into the build from the tag, so the committed value is a placeholder.
#
# If a run tags/releases but fails to publish, a re-run resumes the publish instead of no-oping
# (see "Check for a tagged-but-unpublished release").
name: Publish airflow-provider-overture

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {} # no workflow-level access; each job grants only what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release/publish mid-flight

jobs:
  release:
    name: Target '${{ github.event_name == 'workflow_dispatch' && 'Test PyPI' || 'PyPI' }}'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'test-pypi' || 'pypi' }}
    permissions:
      contents: write # push the release tag (push event only)
      id-token: write # AWS OIDC + PyPI trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The official Docker action resolves GitPython (an unpinned transitive dependency) at
      # image-build time, and GitPython v3.1.60 broke PSR v10.6.1's config load. Install PSR in
      # an isolated pipx venv with GitPython pinned below the broken release instead.
      # See: https://github.com/python-semantic-release/python-semantic-release/issues/1476
      - name: Install python-semantic-release
        if: github.event_name == 'push'
        run: |
          pipx install "python-semantic-release==10.6.1"
          pipx inject --force python-semantic-release "gitpython<3.1.60"

      # GITHUB_TOKEN can never be granted the `workflows` permission, so PSR's tag push is
      # rejected whenever the pushed history contains a `.github/workflows/*` change.
      # overture-pull-requester already has contents:write + workflows:write, so mint a token
      # from it instead.
      - name: Configure AWS credentials for pull-requester PEM
        # Narrow OIDC role (omf-github-terraform's oidc-aws.tf) that can only read this secret.
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::816069134238:role/gha-pull-requester-secrets-reader
          aws-region: us-west-2

      - name: Fetch pull-requester PEM from Secrets Manager
        if: github.event_name == 'push'
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            PULL_REQUESTER_APP_PEM, omf-github-terraform/pull-requester/pem

      - name: Generate release push token
        if: github.event_name == 'push'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liiN80WEARreTV7m # https://github.com/apps/overture-pull-requester
          private-key: ${{ env.PULL_REQUESTER_APP_PEM }} # zizmor: ignore[secrets-outside-env]
          owner: OvertureMaps
          repositories: overture-airflow-provider
          permission-contents: write
          permission-workflows: write

      # Tags and pushes the next version if one is warranted (no commit, no committed changelog;
      # release notes go to the GitHub Release). Skipped on workflow_dispatch.
      - name: Release
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          semantic-release -v version --no-commit --tag --push --no-changelog --vcs-release --skip-build

      # A prior run may have tagged/released but failed before publishing; PSR would then see no
      # new commits and report released=false, so detect that stuck state directly.
      - name: Check for a tagged-but-unpublished release
        id: resume
        if: github.event_name == 'push' && steps.release.outputs.released != 'true'
        run: |
          tag=$(git describe --tags --exact-match --match "v*" HEAD 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "HEAD has no release tag; nothing to resume."
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 \
            "https://pypi.org/pypi/airflow-provider-overture/${version}/json")
          case "$status" in
            200)
              echo "$tag is already on PyPI; nothing to resume."
              echo "unpublished=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "$tag is tagged/released but missing from PyPI; resuming publish."
              echo "unpublished=true" >> "$GITHUB_OUTPUT"
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected HTTP $status checking PyPI for ${version}; refusing to guess publish state."
              exit 1
              ;;
          esac

      - name: Install uv
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.released == 'true' || steps.resume.outputs.unpublished == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # this job publishes a runtime artifact; don't risk a poisoned cache

      - name: Stamp release version
        if: steps.release.outputs.released == 'true' || steps.resume.outputs.unpublished == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version || steps.resume.outputs.version }}
        run: uv version "$VERSION" --frozen

      - name: Build package
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.released == 'true' || steps.resume.outputs.unpublished == 'true'
        run: uv build

      - name: Check package metadata
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.released == 'true' || steps.resume.outputs.unpublished == 'true'
        run: uvx twine check --strict dist/*

      - name: Publish to PyPI
        if: github.event_name == 'push' && (steps.release.outputs.released == 'true' || steps.resume.outputs.unpublished == 'true')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

      - name: Publish to Test PyPI (smoke test)
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: true
